[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nisar-flood"
version = "0.1.0"
description = "NISAR Flood Mapping: Sentinel-1 to NISAR deep learning transfer (CS 59300)"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
nisar-flood = "nisar_flood.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
